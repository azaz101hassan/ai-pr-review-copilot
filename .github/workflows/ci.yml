name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The eval staleness check (apps/api/src/modules/
          # reviews/eval/staleness.ts) compares the recordings' captured
          # gitSha against the latest commit touching tracked paths. With
          # the default fetch-depth: 1, only the PR-merge commit is in the
          # local repo, so `git log -1 -- <paths>` returns that merge
          # commit instead of the real introducing commit on main, and
          # the content-equality fallback's `git diff` can't reach the
          # recording's SHA either. Full history makes both reachable.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 22 LTS — broad prebuilt coverage for better-sqlite3. Local
          # dev uses Node 24; bump here once Node 24 prebuilds settle.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests across workspaces
        # RUN_ANTHROPIC_INTEGRATION is explicitly empty here to put the
        # gate-off policy in writing. The Anthropic integration spec
        # (apps/api/test/infrastructure/anthropic/anthropic-llm-reviewer.integration.spec.ts)
        # would otherwise burn real budget on every PR. Local operators
        # opt in with `RUN_ANTHROPIC_INTEGRATION=true npm test ...`.
        env:
          RUN_ANTHROPIC_INTEGRATION: ''
        run: npm test --workspaces --if-present

      - name: Eval score (offline gate)
        # Runs the offline eval scorer against committed recordings.
        # No API keys needed — reads JSON recordings + manifest only.
        # While thresholds.json is empty this is report-only (exit 0).
        run: npm run eval:score --workspace apps/api

      - name: Reject em-dashes in apps/web UI source
        # Greps every committed .ts(x) under apps/web for U+2014 outside
        # comments. The character is banned in UI copy by the design
        # spec (it reads as AI-generated to the bar this dashboard
        # targets), and the deterministic detector can't catch it when
        # it sits inside JS template literals rather than JSX text.
        run: npm run check:copy --workspace apps/web

      - name: Build apps/web (smoke-test Next.js scaffold)
        run: npm run build --workspace apps/web

  chroma-integration:
    name: Chroma integration smoke
    runs-on: ubuntu-latest
    # Separate job so the offline test suite isn't blocked by the
    # ~30s Chroma container boot. This job ONLY exercises
    # ChromaVectorStore against a real chromadb server — Voyage stays
    # mocked, so this never spends API tokens.
    services:
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Chroma to accept HTTP requests
        # GH Actions `services:` brings the container up but doesn't
        # gate the next step on application readiness. The chroma
        # image needs ~10-20s before /api/v2/heartbeat returns 200,
        # and the runner already has curl on $PATH — simpler than
        # plumbing a Docker healthcheck through the services block.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v2/heartbeat; then
              echo ""
              echo "Chroma is healthy after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "Chroma did not become healthy within 60s"
          docker ps -a
          exit 1

      - name: Run Chroma integration smoke
        env:
          RUN_CHROMA_INTEGRATION: 'true'
          CHROMA_URL: http://localhost:8000
        # Targets the gated spec file only — keeps the run fast and
        # avoids re-executing the 125 offline tests that the `test`
        # job already covered.
        run: npm test --workspace apps/api -- --testPathPattern=chroma-vector-store.integration

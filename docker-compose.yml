# Local dev infrastructure for the PR Review Copilot.
#
# Services:
#   chroma — vector index (Day 2 RAG foundation, see
#           docs/plans/03-day2-rag-foundation.md).
#   redis  — BullMQ backing store for the per-PR review queue (Day 5
#           real-PR integration, see docs/plans/06-day5-real-pr-integration.md
#           and docs/setup/day5-real-pr.md).
#
# Usage:
#   docker compose up -d              # background, all services
#   docker compose up -d redis        # one service
#   docker compose ps                 # health status
#   docker compose down               # stop; data persists in named volumes
#   docker compose down -v            # stop and wipe persisted volumes
#
# See docs/setup/embeddings.md and docs/setup/day5-real-pr.md for the
# full bring-up walkthroughs.

services:
  chroma:
    # Pinned tag — `:latest` would let Chroma silently roll a breaking
    # change into local dev. Bump deliberately when upgrading.
    image: chromadb/chroma:1.5.9
    container_name: pr-copilot-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the data dir so the persisted index survives
      # `docker compose down` and so the contents are inspectable on
      # disk. `/data` is the current Chroma persistence path; the older
      # `/chroma/chroma` from pre-1.x tutorials is obsolete.
      - ./chroma-data:/data
    healthcheck:
      # The chroma image ships without curl/wget/nc — only bash is on
      # the path. We use bash's /dev/tcp pseudo-device to issue an HTTP
      # GET against the v2 heartbeat and grep for `200 OK`. This is
      # equivalent to `curl -fsS http://localhost:8000/api/v2/heartbeat`
      # but doesn't need an extra binary inside the container.
      #
      # The v1 path (`/api/v1/heartbeat`) is removed in current builds —
      # tutorials that still reference it will fail silently here.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200 OK'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    # Pinned tag — Day-5 review queue is BullMQ on Redis. `redis:7-alpine`
    # is the canonical small image; bump deliberately when upgrading.
    image: redis:7-alpine
    container_name: pr-copilot-redis
    restart: unless-stopped
    # Bind to localhost only by default. The whole stack is a single-
    # operator dev environment (Day-5 demo + dogfood). Exposing 6379 on
    # all interfaces would let any machine on the LAN read/write the
    # queue; the password is the only auth and we shouldn't rely on it
    # to deter a network-reachable attacker.
    ports:
      - "127.0.0.1:6379:6379"
    # The `--requirepass` flag also enforces auth for `redis-cli ping`
    # itself, so the healthcheck below passes the same password via
    # REDISCLI_AUTH. REDIS_PASSWORD comes from the host env (apps/api/.env
    # → docker-compose --env-file pattern, or shell export).
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the host shell or .env}"
      - "--appendonly"
      - "yes"
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
